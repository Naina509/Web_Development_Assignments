<!DOCTYPE html>
<html>
<head>
    <title>Movie Listing Portal</title>

    <style>

        /* Universal Selector */
        * {
            box-sizing: border-box;
        }

        /* Element Selector */
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        /* ID Selector */
        #heading {
            color: #222;
            margin: 20px;
        }

        /* Class Selector */
        .movie-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 30%;
            margin: auto;
        }

        .movie-card {
            background-color: white;
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 8px;
        }

        .movie-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .movie-card h2 {
            color: #333;
        }

        .movie-card p {
            color: #666;
        }

        /* Grouping Selector */
        h2, p {
            margin: 10px;
        }

        button {
            background-color: #e50914;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

    </style>
</head>

<body>

    <h1 id="heading">Now Showing</h1>

    <div class="movie-container">

        <!-- Movie 1 -->
        <div class="movie-card">
            <img src="https://cdn.mos.cms.futurecdn.net/qFrfkPkQ68wCmwSAbc3XWL.jpeg">
            <h2>ET (2022)</h2>
            <p>Releasing on 11 Mar, 2022</p>
            <button>Book Tickets</button>
        </div>

        <!-- Movie 2 -->
