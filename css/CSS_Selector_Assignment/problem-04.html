<!DOCTYPE html>
<html>
<head>

    <title>The Periodic Table of Elements</title>

    <style>

        /* Universal Selector */
        * {
            box-sizing: border-box;
        }

        /* Element Selector */
        body {
            font-family: Arial;
            background-color: white;
            text-align: center;
        }

        /* ID Selector */
        #heading {
            font-size: 20px;
            font-weight: normal;
            margin: 25px;
        }

        /* Main Periodic Table */
        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 28px);
            grid-template-rows: repeat(7, 28px);
            gap: 7px;
            justify-content: center;
        }

        /* Common Box */
        .box {
            width: 28px;
            height: 28px;
            border: 1px solid #333;
        }

        /* Colors */

        .green {
            background-color: #8ba52b;
        }

        .red {
            background-color: #ff5555;
        }

        .blue {
            background-color: blue;
        }

        .orange {
            background-color: orangered;
        }

        .purple {
            background-color: #a000a0;
        }

        .pink {
            background-color: #ff1460;
        }

        .yellow {
            background-color: #ffc800;
        }

        .dark {
            background-color: #66575e;
        }

        .white {
            background-color: #fff0e5;
        }

        /* Hydrogen */

        #hydrogen {
            grid-column: 1;
            grid-row: 1;

            color: white;
            font-size: 18px;
            text-align: center;
            padding-top: 3px;
        }

        /* Top Right Yellow Box */

        #top-yellow {
            grid-column: 18;
            grid-row: 1;
        }

        /* Left Green Boxes */

        .green-left {
            grid-column: 1;
        }

        .g2 {
            grid-row: 2;
        }

        .g3 {
            grid-row: 3;
        }

        .g4 {
            grid-row: 4;
        }

        .g5 {
            grid-row: 5;
        }

        .g6 {
            grid-row: 6;
        }

        .g7 {
            grid-row: 7;
        }

        /* Left Red Number Boxes */

        .red-number {
            grid-column: 2;
            text-align: center;
            padding-top: 6px;
            font-size: 11px;
        }

        .r2 {
            grid-row: 2;
        }

        .r3 {
            grid-row: 3;
        }

        .r4 {
            grid-row: 4;
        }

        .r5 {
            grid-row: 5;
        }

        .r6 {
            grid-row: 6;
        }

        .r7 {
            grid-row: 7;
        }

        /* Silicon */

        #silicon {
            grid-column: 4 / span 2;
            grid-row: 2 / span 2;

            width: 91px;
            height: 91px;

            background-color: #8ba52b;
            border: 1px solid #333;

            text-align: left;
            padding: 7px;
        }

        #silicon .number {
            text-align: right;
            font-size: 11px;
        }

        #silicon .symbol {
            font-size: 34px;
            margin-top: 3px;
        }

        #silicon .name {
            font-size: 10px;
        }

        /* Blue Section */

        .blue-section {
            background-color: blue;
            border: 1px solid #333;
        }

        .b1 {
            grid-column: 4;
        }

        .b2 {
            grid-column: 5;
        }

        .b3 {
            grid-column: 6;
        }

        .b4 {
            grid-column: 7;
        }

        .b5 {
            grid-column: 8;
        }

        .b6 {
            grid-column: 9;
        }

        .b7 {
            grid-column: 10;
        }

        .b8 {
            grid-column: 11;
        }

        .b9 {
            grid-column: 12;
        }

        .blue-row-4 {
            grid-row: 4;
        }

        .blue-row-5 {
            grid-row: 5;
        }

        .blue-row-6 {
            grid-row: 6;
        }

        .blue-row-7 {
            grid-row: 7;
        }

        /* White Boxes */

        .white-box-1 {
            grid-column: 3;
            grid-row: 6;
        }

        .white-box-2 {
            grid-column: 3;
            grid-row: 7;
        }

        /* Right Side */

        .right1 {
            grid-column: 13;
        }

        .right2 {
            grid-column: 14;
        }

        .right3 {
            grid-column: 15;
        }

        .right4 {
            grid-column: 16;
        }

        .right5 {
            grid-column: 17;
        }

        .right6 {
            grid-column: 18;
        }

        /* Right Rows */

        .right-row-2 {
            grid-row: 2;
        }

        .right-row-3 {
            grid-row: 3;
        }

        .right-row-4 {
            grid-row: 4;
        }

        .right-row-5 {
            grid-row: 5;
        }

        .right-row-6 {
            grid-row: 6;
        }

        .right-row-7 {
            grid-row: 7;
        }

        /* Bottom Section */

        .bottom-table {
            display: grid;
            grid-template-columns: repeat(15, 22px);
            grid-template-rows: 23px 23px;

            gap: 0;

            justify-content: center;

            margin-top: 35px;
        }

        .bottom-box {
            height: 23px;
            border: 1px solid #555;

            background-color: #40552c;

            color: white;

            font-size: 10px;

            padding-top: 4px;
        }

        .bottom-light {
            background-color: #a5c65a;
            color: black;
        }

        /* Grouping Selector */

        h1, p {
            margin: 10px;
        }

    </style>

</head>

<body>

</html>
